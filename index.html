<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#350914">
  <meta name="description" content="A special Raksha Bandhan wish made with love ❤️">

  <title>Someone Sent You a Raksha Bandhan Wish ❤️</title>

  <style>
    :root {
      --maroon-950: #21050c;
      --maroon-900: #350914;
      --maroon-800: #4b0c1c;
      --maroon-700: #67112b;
      --maroon-600: #851b3c;

      --gold-500: #d89d32;
      --gold-400: #edbd55;
      --gold-300: #ffe09a;
      --gold-200: #fff0c5;

      --cream: #fffaf0;
      --rose: #f5b6c5;

      --shadow: rgba(20, 2, 8, 0.38);

      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(255, 198, 77, .12),
          transparent 28%
        ),
        radial-gradient(
          circle at 15% 80%,
          rgba(181, 43, 80, .15),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          var(--maroon-950),
          var(--maroon-900) 42%,
          var(--maroon-800)
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .12;
      background-image:
        radial-gradient(
          rgba(255,255,255,.8) .5px,
          transparent .5px
        );
      background-size: 5px 5px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    /* ==================================================
       APP
    ================================================== */

    .app {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
    }

    /* ==================================================
       BACKGROUND
    ================================================== */

    .background {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .35;
    }

    .ambient.one {
      width: 300px;
      height: 300px;
      top: -120px;
      left: -100px;
      background: #b82e58;
      animation: ambientOne 10s ease-in-out infinite alternate;
    }

    .ambient.two {
      width: 280px;
      height: 280px;
      right: -120px;
      bottom: 10%;
      background: #d99b2f;
      opacity: .18;
      animation: ambientTwo 12s ease-in-out infinite alternate;
    }

    .ambient.three {
      width: 220px;
      height: 220px;
      left: 45%;
      top: 40%;
      background: #8d173c;
      opacity: .2;
    }

    /* ==================================================
       PARTICLES
    ================================================== */

    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold-300);
      box-shadow:
        0 0 8px rgba(255, 218, 132, .9),
        0 0 18px rgba(255, 194, 70, .45);
      animation: twinkle 3s ease-in-out infinite;
    }

    .petal {
      position: absolute;
      top: -40px;
      width: 12px;
      height: 20px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(
        145deg,
        #ffb8c9,
        #c74c70
      );
      opacity: .7;
      animation: fallingPetal linear infinite;
    }

    .petal:nth-child(odd) {
      border-radius: 0 100% 0 100%;
    }

    /* ==================================================
       ENTRY SCREEN
    ================================================== */

    .entry-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(231, 177, 67, .13),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #21050c,
          #420b1a 55%,
          #5f1029
        );

      transition:
        opacity .8s var(--ease),
        visibility .8s ease;
    }

    .entry-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .entry-card {
      position: relative;
      width: min(92vw, 520px);
      padding: clamp(28px, 7vw, 52px);
      text-align: center;

      border: 1px solid rgba(255, 220, 140, .25);
      border-radius: 32px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.10),
          rgba(255,255,255,.035)
        );

      box-shadow:
        0 35px 100px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.12);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      animation: entryCard .9s var(--ease);
    }

    .entry-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255,215,128,.08);
      border-radius: 24px;
      pointer-events: none;
    }

    .mini-rakhi {
      position: relative;
      width: 95px;
      height: 95px;
      margin: 0 auto 25px;
      display: grid;
      place-items: center;
    }

    .mini-rakhi::before,
    .mini-rakhi::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 28px;
      border-radius: 50%;
      background:
        repeating-linear-gradient(
          90deg,
          #d49a31 0 6px,
          #f2c35b 6px 12px
        );
    }

    .mini-rakhi::before {
      transform: rotate(25deg);
    }

    .mini-rakhi::after {
      transform: rotate(-25deg);
    }

    .mini-rakhi-center {
      position: relative;
      z-index: 2;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 5px solid #f5c65d;
      background:
        radial-gradient(
          circle,
          #fff0b4,
          #d8892b 60%,
          #8c1b38
        );
      box-shadow:
        0 0 0 7px rgba(239,183,72,.1),
        0 0 30px rgba(245,196,81,.35);
    }

    .mini-rakhi-center::after {
      content: "✦";
      color: #7c1633;
      font-size: 24px;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--gold-300);
      font-family: Arial, sans-serif;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .entry-card h1 {
      color: white;
      font-size: clamp(2rem, 8vw, 3.3rem);
      line-height: 1.05;
      margin-bottom: 15px;
    }

    .entry-card h1 span {
      color: var(--gold-300);
    }

    .entry-description {
      max-width: 390px;
      margin: 0 auto 28px;
      color: rgba(255,255,255,.72);
      font-family: Arial, sans-serif;
      font-size: .95rem;
      line-height: 1.7;
    }

    .entry-form {
      position: relative;
      z-index: 2;
    }

    .name-input {
      width: 100%;
      height: 58px;
      padding: 0 20px;

      color: #421020;
      background: #fffaf1;

      border: 2px solid transparent;
      border-radius: 17px;

      outline: none;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 1rem;

      transition: .25s ease;
    }

    .name-input:focus {
      border-color: var(--gold-400);
      box-shadow:
        0 0 0 4px rgba(237,189,85,.14),
        0 12px 30px rgba(0,0,0,.15);
    }

    .entry-button {
      width: 100%;
      height: 58px;
      margin-top: 12px;

      cursor: pointer;

      color: #39100e;
      font-family: Arial, sans-serif;
      font-size: .95rem;
      font-weight: 800;

      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          #ffe4a0,
          #efbd50 50%,
          #d99a2e
        );

      box-shadow:
        0 12px 30px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.6);

      transition:
        transform .25s var(--ease),
        box-shadow .25s ease;
    }

    .entry-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 17px 35px rgba(0,0,0,.32),
        inset 0 1px rgba(255,255,255,.7);
    }

    .entry-button:active {
      transform: scale(.98);
    }

    .error {
      min-height: 21px;
      margin-top: 8px;
      color: #ffb7c7;
      font-family: Arial, sans-serif;
      font-size: .78rem;
    }

    /* ==================================================
       MAIN
    ================================================== */

    .main {
      position: relative;
      z-index: 5;
      display: none;
      min-height: 100svh;
    }

    .main.active {
      display: block;
      animation: mainReveal 1.1s var(--ease);
    }

    .hero {
      min-height: calc(100svh - 62px);
      display: grid;
      place-items: center;
      padding:
        45px
        max(20px, env(safe-area-inset-right))
        45px
        max(20px, env(safe-area-inset-left));
    }

    .hero-inner {
      width: min(100%, 980px);
      text-align: center;
    }

    .received {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 9px 15px;
      margin-bottom: 20px;

      border: 1px solid rgba(255,217,130,.18);
      border-radius: 100px;

      background: rgba(255,255,255,.055);

      color: var(--gold-200);
      font-family: Arial, sans-serif;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: 1.7px;
      text-transform: uppercase;

      backdrop-filter: blur(10px);
    }

    /* ==================================================
       HERO RAKHI
    ================================================== */

    .rakhi-stage {
      position: relative;
      width: min(68vw, 300px);
      height: min(68vw, 300px);
      margin: 0 auto 25px;

      display: grid;
      place-items: center;
    }

    .rakhi-glow {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: rgba(226,166,53,.14);
      filter: blur(25px);
      animation: rakhiGlow 3s ease-in-out infinite;
    }

    .rakhi-thread {
      position: absolute;
      width: 94%;
      height: 62px;
      border-radius: 50%;
      background:
        repeating-linear-gradient(
          90deg,
          #9d5527 0 7px,
          #e2a33a 7px 13px,
          #6e2634 13px 19px,
          #f2c85e 19px 25px
        );
      box-shadow:
        0 10px 25px rgba(0,0,0,.25);
    }

    .rakhi-thread.one {
      transform: rotate(22deg);
    }

    .rakhi-thread.two {
      transform: rotate(-22deg);
    }

    .rakhi-medallion {
      position: relative;
      z-index: 4;
      width: 145px;
      height: 145px;
      display: grid;
      place-items: center;
      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 28%,
          #fff5c9 0 8%,
          #f0c25c 10%,
          #bd7128 45%,
          #7c1733 72%,
          #430c1d
        );

      border: 8px solid #e5b14d;

      box-shadow:
        0 0 0 8px rgba(232,183,75,.12),
        0 0 0 15px rgba(232,183,75,.055),
        0 25px 45px rgba(0,0,0,.35),
        inset 0 3px 8px rgba(255,255,255,.35);

      animation:
        rakhiFloat 4s ease-in-out infinite;
    }

    .rakhi-medallion::before {
      content: "";
      position: absolute;
      inset: 17px;
      border: 2px dashed rgba(255,241,188,.65);
      border-radius: 50%;
    }

    .rakhi-symbol {
      position: relative;
      z-index: 2;
      color: #fff0b4;
      font-size: 58px;
      line-height: 1;
      text-shadow:
        0 3px 10px rgba(83,19,30,.55);
    }

    .rakhi-bead {
      position: absolute;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--gold-400);
      box-shadow: 0 0 12px rgba(244,190,74,.5);
    }

    .rakhi-bead:nth-child(1) {
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
    }

    .rakhi-bead:nth-child(2) {
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
    }

    .rakhi-bead:nth-child(3) {
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
    }

    .rakhi-bead:nth-child(4) {
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* ==================================================
       TEXT
    ================================================== */

    .main-eyebrow {
      color: var(--gold-300);
      font-family: Arial, sans-serif;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .greeting {
      max-width: 900px;
      margin: auto;

      font-size: clamp(
        2.35rem,
        8vw,
        5.8rem
      );

      line-height: .98;
      letter-spacing: -2px;

      text-wrap: balance;

      color: #fffaf1;
      text-shadow:
        0 10px 30px rgba(0,0,0,.28);
    }

    .greeting .name {
      display: inline-block;
      color: var(--gold-300);
      text-shadow:
        0 0 25px rgba(244,191,75,.18);
    }

    .subtitle {
      max-width: 620px;
      margin: 20px auto 0;

      color: rgba(255,255,255,.68);

      font-family: Arial, sans-serif;
      font-size: clamp(.92rem, 2.4vw, 1.05rem);
      line-height: 1.7;
    }

    /* ==================================================
       QUOTE
    ================================================== */

    .quote-card {
      position: relative;
      width: min(100%, 760px);
      margin: 34px auto 0;
      padding: 28px 32px;

      border: 1px solid rgba(255,215,133,.13);
      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.025)
        );

      box-shadow:
        0 20px 55px rgba(0,0,0,.18),
        inset 0 1px rgba(255,255,255,.06);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .quote-symbol {
      position: absolute;
      color: rgba(239,190,83,.12);
      font-size: 75px;
      line-height: 1;
    }

    .quote-symbol.left {
      left: 14px;
      top: 4px;
    }

    .quote-symbol.right {
      right: 14px;
      bottom: -25px;
    }

    .quote {
      color: #fff0d1;
      font-size: clamp(
        1.05rem,
        3vw,
        1.45rem
      );
      line-height: 1.75;

      transition:
        opacity .3s ease,
        transform .3s ease;
    }

    .quote.fade {
      opacity: 0;
      transform: translateY(8px);
    }

    /* ==================================================
       ACTIONS
    ================================================== */

    .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 11px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .share-button {
      min-height: 56px;
      min-width: 230px;
      padding: 0 25px;

      cursor: pointer;

      border-radius: 16px;

      color: #3c100f;

      font-family: Arial, sans-serif;
      font-size: .9rem;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          #ffe6a3,
          #e9b548
        );

      box-shadow:
        0 13px 28px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.65);

      transition:
        transform .2s var(--ease),
        box-shadow .2s ease;
    }

    .share-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 18px 34px rgba(0,0,0,.3),
        inset 0 1px rgba(255,255,255,.7);
    }

    .whatsapp-button {
      min-height: 56px;
      padding: 0 20px;

      cursor: pointer;

      border-radius: 16px;

      color: white;

      font-family: Arial, sans-serif;
      font-size: .9rem;
      font-weight: 700;

      background:
        rgba(255,255,255,.065);

      border: 1px solid rgba(255,255,255,.13);

      backdrop-filter: blur(10px);

      transition: .2s ease;
    }

    .whatsapp-button:hover {
      background: rgba(255,255,255,.11);
      transform: translateY(-2px);
    }

    .music-control {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 56px;
      height: 56px;

      cursor: pointer;

      border-radius: 50%;

      color: var(--gold-300);

      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,215,130,.2);

      font-size: 19px;

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .music-control:hover {
      transform: scale(1.06);
      background: rgba(255,255,255,.09);
    }

    .music-label {
      margin-top: 9px;

      color: rgba(255,255,255,.45);

      font-family: Arial, sans-serif;
      font-size: .72rem;
    }

    /* ==================================================
       FOOTER
    ================================================== */

    footer {
      position: relative;
      z-index: 10;

      min-height: 62px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        16px
        max(20px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      border-top: 1px solid rgba(255,255,255,.07);

      background: rgba(24,3,9,.65);

      color: rgba(255,255,255,.52);

      font-family: Arial, sans-serif;
      font-size: .75rem;
      text-align: center;
    }

    footer strong {
      margin-left: 5px;
      color: var(--gold-300);
    }

    /* ==================================================
       TOAST
    ================================================== */

    .toast {
      position: fixed;
      z-index: 500;

      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));

      width: min(
        calc(100% - 30px),
        430px
      );

      padding: 14px 17px;

      transform:
        translate(-50%, 100px);

      opacity: 0;

      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;

      background: rgba(38,5,15,.95);

      color: white;

      font-family: Arial, sans-serif;
      font-size: .82rem;
      text-align: center;

      box-shadow: 0 20px 50px rgba(0,0,0,.35);

      transition:
        transform .35s var(--ease),
        opacity .35s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ==================================================
       ANIMATIONS
    ================================================== */

    @keyframes entryCard {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes mainReveal {
      from {
        opacity: 0;
        transform: scale(.985);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes rakhiFloat {
      0%, 100% {
        transform:
          translateY(0)
          rotate(-1deg);
      }

      50% {
        transform:
          translateY(-10px)
          rotate(1deg);
      }
    }

    @keyframes rakhiGlow {
      0%, 100% {
        transform: scale(.92);
        opacity: .6;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: .12;
        transform: scale(.5);
      }

      50% {
        opacity: 1;
        transform: scale(1.35);
      }
    }

    @keyframes fallingPetal {
      from {
        transform:
          translate3d(0, -50px, 0)
          rotate(0);
      }

      to {
